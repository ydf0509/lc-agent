<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>天安门 · 三维复原</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #14100e; }
  canvas { display: block; width: 100%; height: 100%; }

  .hud {
    position: fixed; top: 34px; left: 38px; z-index: 3;
    pointer-events: none; color: #f6ead8;
  }
  .hud h1 {
    font-family: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
    font-size: clamp(26px, 3.4vw, 46px);
    font-weight: 600; letter-spacing: 0.42em;
    text-shadow: 0 2px 22px rgba(0, 0, 0, 0.6);
  }
  .hud p {
    margin-top: 10px;
    font-family: ui-sans-serif, "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: 10px; letter-spacing: 0.34em;
    color: rgba(246, 234, 216, 0.55);
  }
  .hud::after {
    content: ""; display: block; width: 54px; height: 1px; margin-top: 18px;
    background: linear-gradient(90deg, #c9a227, rgba(201, 162, 39, 0));
  }
  .hint {
    position: fixed; right: 38px; bottom: 30px; z-index: 3;
    font-family: ui-sans-serif, "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: 11px; letter-spacing: 0.18em;
    color: rgba(246, 234, 216, 0.62);
    text-shadow: 0 1px 12px rgba(20, 10, 4, 0.85);
    pointer-events: none;
  }
  @media (max-width: 640px) {
    .hud { top: 20px; left: 20px; }
    .hud p { letter-spacing: 0.24em; }
    .hint { right: 20px; bottom: 18px; font-size: 10px; letter-spacing: 0.1em; }
  }

  #loader {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;
    background: #14100e;
    transition: opacity 0.9s ease, visibility 0.9s ease;
  }
  #loader.done { opacity: 0; visibility: hidden; }
  .ring {
    width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid rgba(201, 162, 39, 0.22);
    border-top-color: #c9a227;
    animation: spin 1.05s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loader p {
    font-family: ui-sans-serif, "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: 11px; letter-spacing: 0.3em; color: rgba(246, 234, 216, 0.45);
  }

  #error {
    position: fixed; inset: 0; z-index: 20; display: none;
    align-items: center; justify-content: center; padding: 32px;
    background: #14100e; color: #f6ead8; text-align: center;
    font-family: ui-sans-serif, "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: 13px; line-height: 2; letter-spacing: 0.08em;
  }
</style>
</head>

<div id="loader"><div class="ring"></div><p>正在构筑天安门</p></div>
<div id="error">加载失败：请确认网络可访问 cdn.jsdelivr.net，然后刷新页面。</div>

<header class="hud">
  <h1>天安门</h1>
  <p>TIANANMEN &middot; BEIJING</p>
</header>
<div class="hint">拖拽旋转 &nbsp;·&nbsp; 滚轮缩放</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { SSAOPass } from 'three/addons/postprocessing/SSAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ============================================================
   0. 基础渲染环境
   ============================================================ */

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xc9a07a, 160, 430);

const camera = new THREE.PerspectiveCamera(43, window.innerWidth / window.innerHeight, 0.5, 900);
camera.position.set(48, 20, 80);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 15, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 42;
controls.maxDistance = 230;
controls.minPolarAngle = 0.22;
controls.maxPolarAngle = 1.49;
controls.update();

/* 后处理：SSAO + 输出色彩管理 */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const ssaoPass = new SSAOPass(scene, camera, window.innerWidth, window.innerHeight);
ssaoPass.kernelRadius = 3.5;
ssaoPass.minDistance = 0.003;
ssaoPass.maxDistance = 0.08;
composer.addPass(ssaoPass);

const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.1,
  0.55,
  0.97
);
composer.addPass(bloomPass);

/* 轻微降饱和 + 暗角 + 胶片颗粒 */
const gradePass = new ShaderPass({
  uniforms: {
    tDiffuse: { value: null },
    uTime: { value: 0 },
    uVignette: { value: 0.55 },
    uGrain: { value: 0.012 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float uTime;
    uniform float uVignette;
    uniform float uGrain;
    varying vec2 vUv;
    float rand(vec2 co) {
      return fract(sin(dot(co, vec2(12.9898, 78.233))) * 43758.5453);
    }
    void main() {
      vec2 dir = vUv - 0.5;
      float d = length(dir);
      float ca = d * d * 0.0022;
      vec2 off = dir * ca;
      float r = texture2D(tDiffuse, vUv + off).r;
      float g = texture2D(tDiffuse, vUv).g;
      float b = texture2D(tDiffuse, vUv - off).b;
      vec4 c = vec4(r, g, b, 1.0);

      float l = dot(c.rgb, vec3(0.299, 0.587, 0.114));
      c.rgb = mix(vec3(l), c.rgb, 0.95);
      float v = smoothstep(0.32, 0.95, d * 1.18);
      c.rgb *= 1.0 - v * 0.3 * uVignette;
      c.rgb += (rand(vUv * (uTime + 1.0)) - 0.5) * uGrain;
      gl_FragColor = c;
    }
  `
});
composer.addPass(gradePass);

composer.addPass(new OutputPass());

/* ============================================================
   1. 程序化纹理
   ============================================================ */

function makeCanvas(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  return c;
}

function canvasTexture(canvas, { repeatX = 1, repeatY = 1, srgb = true } = {}) {
  const t = new THREE.CanvasTexture(canvas);
  t.wrapS = THREE.RepeatWrapping;
  t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeatX, repeatY);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function grain(ctx, w, h, amount, alpha) {
  for (let i = 0; i < amount; i++) {
    const x = Math.random() * w;
    const y = Math.random() * h;
    const v = Math.random() > 0.5 ? 255 : 0;
    ctx.fillStyle = `rgba(${v},${v},${v},${alpha * Math.random()})`;
    ctx.fillRect(x, y, 1 + Math.random() * 2, 1 + Math.random() * 2);
  }
}

/* 由灰度高度图生成切线空间法线贴图 */
function canvasToNormalTexture(canvas, strength = 2.0) {
  const w = canvas.width;
  const h = canvas.height;
  const src = canvas.getContext('2d').getImageData(0, 0, w, h).data;
  const out = document.createElement('canvas');
  out.width = w;
  out.height = h;
  const ctx = out.getContext('2d');
  const img = ctx.createImageData(w, h);
  const lum = new Float32Array(w * h);

  for (let i = 0; i < w * h; i++) {
    lum[i] = (src[i * 4] * 0.299 + src[i * 4 + 1] * 0.587 + src[i * 4 + 2] * 0.114) / 255;
  }

  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const xl = (x - 1 + w) % w;
      const xr = (x + 1) % w;
      const yu = (y - 1 + h) % h;
      const yd = (y + 1) % h;
      const dx = (lum[y * w + xr] - lum[y * w + xl]) * strength;
      const dy = (lum[yd * w + x] - lum[yu * w + x]) * strength;
      const nx = -dx;
      const ny = -dy;
      const nz = 1;
      const len = Math.hypot(nx, ny, nz);
      const i = (y * w + x) * 4;
      img.data[i] = (nx / len * 0.5 + 0.5) * 255;
      img.data[i + 1] = (ny / len * 0.5 + 0.5) * 255;
      img.data[i + 2] = (nz / len * 0.5 + 0.5) * 255;
      img.data[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);

  const tex = new THREE.CanvasTexture(out);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

/* 高度图：宫墙砖缝 */
const wallHeightCanvas = makeCanvas(512, 512, (ctx, w, h) => {
  ctx.fillStyle = '#f2f2f2';
  ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = '#5c5c5c';
  ctx.lineWidth = 4;
  for (let y = 0; y <= h; y += 64) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  }
  for (let y = 0; y < h; y += 64) {
    for (let x = (y / 64) % 2 ? 64 : 0; x <= w; x += 128) {
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 64); ctx.stroke();
    }
  }
  grain(ctx, w, h, 1800, 0.12);
});

/* 高度图：琉璃瓦垄 */
const roofHeightCanvas = makeCanvas(512, 512, (ctx, w, h) => {
  ctx.fillStyle = '#888888';
  ctx.fillRect(0, 0, w, h);
  for (let x = 0; x < w; x += 32) {
    const g = ctx.createLinearGradient(x, 0, x + 32, 0);
    g.addColorStop(0, '#3a3a3a');
    g.addColorStop(0.16, '#f0f0f0');
    g.addColorStop(0.5, '#ffffff');
    g.addColorStop(0.84, '#f0f0f0');
    g.addColorStop(1, '#3a3a3a');
    ctx.fillStyle = g;
    ctx.fillRect(x, 0, 32, h);
  }
  ctx.fillStyle = 'rgba(40,40,40,0.55)';
  for (let y = 0; y < h; y += 58) {
    ctx.fillRect(0, y, w, 3);
  }
});

/* 高度图：汉白玉石缝 */
const stoneHeightCanvas = makeCanvas(512, 512, (ctx, w, h) => {
  ctx.fillStyle = '#f4f4f4';
  ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = '#6a6a6a';
  ctx.lineWidth = 3;
  for (let y = 0; y <= h; y += 128) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  }
  for (let y = 0; y < h; y += 128) {
    for (let x = (y / 128) % 2 ? 96 : 0; x <= w; x += 192) {
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 128); ctx.stroke();
    }
  }
  grain(ctx, w, h, 1600, 0.1);
});

/* 高度图：广场石板 */
const pavingHeightCanvas = makeCanvas(512, 512, (ctx, w, h) => {
  ctx.fillStyle = '#eeeeee';
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#5a5a5a';
  for (let y = 0; y < h; y += 64) {
    ctx.fillRect(0, y, w, 4);
    for (let x = 0; x < w; x += 64) {
      ctx.fillRect(x, y, 4, 64);
    }
  }
  grain(ctx, w, h, 2200, 0.12);
});

/* 高度图：隔扇格心 */
const latticeHeightCanvas = makeCanvas(256, 512, (ctx, w, h) => {
  ctx.fillStyle = '#3a3a3a';
  ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 7;
  ctx.strokeRect(10, 10, w - 20, h * 0.64);
  ctx.lineWidth = 4;
  for (let x = 18; x < w - 18; x += 26) {
    ctx.beginPath(); ctx.moveTo(x, 14); ctx.lineTo(x, h * 0.64); ctx.stroke();
  }
  for (let y = 16; y < h * 0.64; y += 30) {
    ctx.beginPath(); ctx.moveTo(14, y); ctx.lineTo(w - 14, y); ctx.stroke();
  }
  ctx.fillStyle = '#d0d0d0';
  ctx.fillRect(10, h * 0.7, w - 20, h * 0.26);
});

/* 红色宫墙：细砖缝 + 颗粒 */
const wallCanvas = makeCanvas(512, 512, (ctx, w, h) => {
  ctx.fillStyle = '#7a1d18';
  ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = 'rgba(70,14,12,0.16)';
  ctx.lineWidth = 2;
  for (let y = 0; y <= h; y += 64) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  }
  for (let y = 0; y < h; y += 64) {
    for (let x = (y / 64) % 2 ? 64 : 0; x <= w; x += 128) {
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 64); ctx.stroke();
    }
  }
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, 'rgba(255,190,150,0.10)');
  g.addColorStop(0.55, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(40,0,0,0.22)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

  for (let i = 0; i < 16; i++) {
    const x = Math.random() * w;
    const ww = 2 + Math.random() * 9;
    const stain = ctx.createLinearGradient(0, 0, 0, h);
    stain.addColorStop(0, 'rgba(35,8,6,0.12)');
    stain.addColorStop(0.55, 'rgba(35,8,6,0.05)');
    stain.addColorStop(1, 'rgba(35,8,6,0)');
    ctx.fillStyle = stain;
    ctx.fillRect(x, 0, ww, h);
  }

  grain(ctx, w, h, 2600, 0.05);
});

/* 黄琉璃瓦：竖向瓦垄 + 横向搭接 */
const roofCanvas = makeCanvas(512, 512, (ctx, w, h) => {
  ctx.fillStyle = '#a87526';
  ctx.fillRect(0, 0, w, h);
  const pitch = 32;
  for (let x = 0; x < w; x += pitch) {
    const g = ctx.createLinearGradient(x, 0, x + pitch, 0);
    g.addColorStop(0, '#7f561a');
    g.addColorStop(0.18, '#d0a041');
    g.addColorStop(0.48, '#e2b95c');
    g.addColorStop(0.78, '#b98a34');
    g.addColorStop(1, '#6f4a15');
    ctx.fillStyle = g;
    ctx.fillRect(x, 0, pitch, h);
    ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.045})`;
    ctx.fillRect(x, 0, pitch, h);
    ctx.fillStyle = `rgba(0,0,0,${Math.random() * 0.035})`;
    ctx.fillRect(x, 0, pitch, h);
  }
  ctx.strokeStyle = 'rgba(90,55,12,0.16)';
  ctx.lineWidth = 2;
  for (let y = 0; y < h; y += 58) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  }
  grain(ctx, w, h, 1200, 0.05);
});

/* 汉白玉 */
const stoneCanvas = makeCanvas(512, 512, (ctx, w, h) => {
  ctx.fillStyle = '#ddd6c8';
  ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = 'rgba(120,112,98,0.22)';
  ctx.lineWidth = 1;
  for (let y = 0; y <= h; y += 128) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  }
  for (let y = 0; y < h; y += 128) {
    for (let x = (y / 128) % 2 ? 96 : 0; x <= w; x += 192) {
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 128); ctx.stroke();
    }
  }
  grain(ctx, w, h, 2000, 0.06);
});

/* 广场石板 */
const pavingCanvas = makeCanvas(512, 512, (ctx, w, h) => {
  ctx.fillStyle = '#7a7266';
  ctx.fillRect(0, 0, w, h);
  const cell = 64;
  for (let y = 0; y < h; y += cell) {
    for (let x = 0; x < w; x += cell) {
      const v = 96 + Math.floor(Math.random() * 24);
      ctx.fillStyle = `rgb(${v + 24},${v + 18},${v + 8})`;
      ctx.fillRect(x + 2, y + 2, cell - 4, cell - 4);
      ctx.fillStyle = 'rgba(255,255,255,0.035)';
      ctx.fillRect(x + 2, y + 2, cell - 4, 2);
    }
  }
  grain(ctx, w, h, 3000, 0.07);

  const stain = ctx.createRadialGradient(w * 0.3, h * 0.4, 20, w * 0.5, h * 0.5, w * 0.8);
  stain.addColorStop(0, 'rgba(40,36,30,0.12)');
  stain.addColorStop(0.5, 'rgba(0,0,0,0)');
  stain.addColorStop(1, 'rgba(30,26,20,0.16)');
  ctx.fillStyle = stain;
  ctx.fillRect(0, 0, w, h);
});

/* 隔扇门窗：上部格心、下部裙板 */
const latticeCanvas = makeCanvas(256, 512, (ctx, w, h) => {
  ctx.fillStyle = '#6b2a1d';
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#5a2017';
  ctx.fillRect(0, h * 0.68, w, h * 0.32);

  ctx.strokeStyle = '#c99b52';
  ctx.lineWidth = 5;
  ctx.strokeRect(10, 10, w - 20, h * 0.64);
  ctx.strokeRect(10, h * 0.7, w - 20, h * 0.26);

  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(214,168,92,0.85)';
  const top = 18, bottom = h * 0.64;
  for (let x = 18; x < w - 18; x += 26) {
    ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, bottom); ctx.stroke();
  }
  for (let y = top; y < bottom; y += 30) {
    ctx.beginPath(); ctx.moveTo(18, y); ctx.lineTo(w - 18, y); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(60,18,12,0.5)';
  ctx.lineWidth = 2;
  for (let i = -h; i < w; i += 46) {
    ctx.beginPath(); ctx.moveTo(i, top); ctx.lineTo(i + 120, bottom); ctx.stroke();
  }
  grain(ctx, w, h, 700, 0.05);
});

/* 门扇：深红 + 金色门钉 */
const doorCanvas = makeCanvas(256, 256, (ctx, w, h) => {
  ctx.fillStyle = '#3f1712';
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(w / 2 - 2, 0, 4, h);
  for (let y = 26; y < h; y += 34) {
    for (let x = 24; x < w; x += 34) {
      ctx.beginPath();
      ctx.arc(x, y, 6, 0, Math.PI * 2);
      const g = ctx.createRadialGradient(x - 2, y - 2, 1, x, y, 7);
      g.addColorStop(0, '#f4d27a');
      g.addColorStop(1, '#8f6a22');
      ctx.fillStyle = g;
      ctx.fill();
    }
  }
  grain(ctx, w, h, 600, 0.06);
});

/* 檐下彩画 */
const caihuaCanvas = makeCanvas(512, 128, (ctx, w, h) => {
  ctx.fillStyle = '#1d4f4b';
  ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = '#c9a227';
  ctx.lineWidth = 4;
  ctx.strokeRect(4, 4, w - 8, h - 8);
  for (let x = 0; x < w; x += 64) {
    ctx.beginPath();
    ctx.moveTo(x + 32, 22);
    ctx.lineTo(x + 54, h / 2);
    ctx.lineTo(x + 32, h - 22);
    ctx.lineTo(x + 10, h / 2);
    ctx.closePath();
    ctx.fillStyle = 'rgba(201,162,39,0.35)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(240,214,140,0.7)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(x + 32, h / 2, 6, 0, Math.PI * 2);
    ctx.fillStyle = '#e8c86a';
    ctx.fill();
  }
  grain(ctx, w, h, 400, 0.05);
});

/* 匾额 */
const plaqueCanvas = makeCanvas(1024, 300, (ctx, w, h) => {
  ctx.fillStyle = '#7f1d18';
  ctx.fillRect(0, 0, w, h);
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, 'rgba(255,200,140,0.18)');
  g.addColorStop(1, 'rgba(0,0,0,0.28)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

  ctx.strokeStyle = '#d9b45a';
  ctx.lineWidth = 10;
  ctx.strokeRect(14, 14, w - 28, h - 28);
  ctx.lineWidth = 3;
  ctx.strokeRect(32, 32, w - 64, h - 64);

  ctx.fillStyle = '#f0d488';

/* ============================================================
   4. 屋顶几何（庑殿顶参数化，含起翘）
   ============================================================ */

function createRoofGeometry(W, D, H, opts = {}) {
  const upturn = opts.upturn ?? 1.2;
  const segU = opts.segU ?? 44;
  const segV = opts.segV ?? 12;
  const halfW = W / 2;
  const halfD = D / 2;
  const L = Math.max(0.6, (W - D) / 2);

  const positions = [];
  const uvs = [];
  const indices = [];

  function pushFace(kind) {
    const base = positions.length / 3;
    for (let iv = 0; iv <= segV; iv++) {
      const v = iv / segV;
      for (let iu = 0; iu <= segU; iu++) {
        const u = iu / segU;
        let x, y, z;
        if (kind === 'front' || kind === 'back') {
          const zSign = kind === 'front' ? 1 : -1;
          const xEave = -halfW + u * W;
          const xRidge = -L + u * 2 * L;
          x = THREE.MathUtils.lerp(xEave, xRidge, v);
          z = THREE.MathUtils.lerp(zSign * halfD, 0, v);
          const eaveY = upturn * Math.pow(Math.abs(xEave) / halfW, 3.6);
          const vt = 0.34 * v + 0.66 * Math.pow(v, 1.75);
          y = THREE.MathUtils.lerp(eaveY, H, vt);
          uvs.push(x / 4.8, v * 1.6);
        } else {
          const xSign = kind === 'right' ? 1 : -1;
          const zEave = -halfD + u * D;
          z = THREE.MathUtils.lerp(zEave, 0, v);
          x = THREE.MathUtils.lerp(xSign * halfW, xSign * L, v);
          const eaveY = upturn * Math.pow(Math.abs(zEave) / halfD, 3.6);
          const vt = 0.34 * v + 0.66 * Math.pow(v, 1.75);
          y = THREE.MathUtils.lerp(eaveY, H, vt);
          uvs.push(z / 4.8, v * 1.6);
        }
        positions.push(x, y, z);
      }
    }
    for (let iv = 0; iv < segV; iv++) {
      for (let iu = 0; iu < segU; iu++) {
        const a = base + iv * (segU + 1) + iu;
        const b = a + 1;
        const c = a + (segU + 1);
        const d = c + 1;
        if (kind === 'front' || kind === 'left') {
          indices.push(a, b, c, b, d, c);
        } else {
          indices.push(a, c, b, b, c, d);
        }
      }
    }
  }

  pushFace('front');
  pushFace('back');
  pushFace('left');
  pushFace('right');

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  return geo;
}

const eaveTileGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.18, 8);
eaveTileGeo.rotateX(Math.PI / 2);
const eaveTileMat = new THREE.MeshStandardMaterial({ color: 0xc59a45, roughness: 0.38, metalness: 0.3 });

function addEaveTiles(parent, W, D, y0, upturn) {
  const spacing = 0.46;
  const halfW = W / 2;
  const halfD = D / 2;
  const nx = Math.floor(W / spacing);
  const nz = Math.floor(D / spacing);
  const mesh = new THREE.InstancedMesh(eaveTileGeo, eaveTileMat, nx * 2 + nz * 2);
  const dummy = new THREE.Object3D();
  let idx = 0;

  function place(x, y, z, ry) {
    dummy.position.set(x, y, z);
    dummy.rotation.set(0, ry, 0);
    dummy.updateMatrix();
    mesh.setMatrixAt(idx++, dummy.matrix);
  }

  for (const sz of [1, -1]) {
    for (let i = 0; i < nx; i++) {
      const x = -halfW + (i + 0.5) * (W / nx);
      const y = y0 + upturn * Math.pow(Math.abs(x) / halfW, 3.6);
      place(x, y - 0.03, sz * (halfD + 0.03), sz > 0 ? 0 : Math.PI);
    }
  }
  for (const sx of [1, -1]) {
    for (let i = 0; i < nz; i++) {
      const z = -halfD + (i + 0.5) * (D / nz);
      const y = y0 + upturn * Math.pow(Math.abs(z) / halfD, 3.6);
      place(sx * (halfW + 0.03), y - 0.03, z, sx > 0 ? Math.PI / 2 : -Math.PI / 2);
    }
  }

  mesh.castShadow = true;
  parent.add(mesh);
}

function addRidges(parent, W, D, H, y0, upturn) {
  const L = Math.max(0.6, (W - D) / 2);

  const ridge = new THREE.Mesh(new THREE.BoxGeometry(L * 2 + 1.1, 0.62, 0.68), roofMat);
  ridge.position.set(0, y0 + H + 0.31, 0);
  ridge.castShadow = true;
  parent.add(ridge);

  const ridgeTop = new THREE.Mesh(new THREE.BoxGeometry(L * 2 + 0.8, 0.14, 0.8), eaveTileMat);
  ridgeTop.position.set(0, y0 + H + 0.66, 0);
  parent.add(ridgeTop);

  for (const sx of [-1, 1]) {
    const chi = new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.14, 8, 18, Math.PI * 1.25), roofMat);
    chi.position.set(sx * (L + 0.42), y0 + H + 0.72, 0);
    chi.rotation.y = Math.PI / 2;
    chi.rotation.z = sx * 0.35;
    chi.castShadow = true;
    parent.add(chi);
  }

  const cornerY = y0 + upturn;
  const corners = [
    [W / 2, cornerY, D / 2, L, y0 + H, 0],
    [-W / 2, cornerY, D / 2, -L, y0 + H, 0],
    [W / 2, cornerY, -D / 2, L, y0 + H, 0],
    [-W / 2, cornerY, -D / 2, -L, y0 + H, 0]
  ];

  for (const [cx, cy, cz, rx, ry, rz] of corners) {
    const start = new THREE.Vector3(rx, ry, rz);
    const end = new THREE.Vector3(cx, cy, cz);
    const mid = new THREE.Vector3((rx + cx) / 2, (ry + cy) / 2 + 0.55, (rz + cz) / 2);
    const curve = new THREE.QuadraticBezierCurve3(start, mid, end);
    const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 24, 0.11, 6, false), roofMat);
    tube.castShadow = true;
    parent.add(tube);

    for (let i = 1; i <= 3; i++) {
      const p = curve.getPoint(0.58 + i * 0.11);
      const beast = new THREE.Mesh(new THREE.SphereGeometry(0.15 - i * 0.02, 7, 5), roofMat);
      beast.position.copy(p);
      beast.position.y += 0.13;
      parent.add(beast);
    }

    const tip = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.3, 0.26), eaveTileMat);
    tip.position.copy(end);
    tip.position.y += 0.16;
    tip.rotation.y = Math.PI / 4;
    parent.add(tip);
  }
}

function addGable(parent, W, D, H, y, inset = 3.0) {
  const L = Math.max(0.6, (W - D) / 2);
  const halfW = W / 2;
  const halfD = D / 2;
  const x = L + inset;
  const v = Math.min(0.92, Math.max(0.1, (halfW - x) / (halfW - L)));
  const vt = 0.34 * v + 0.66 * Math.pow(v, 1.75);
  const baseY = y + H * vt;
  const zHalf = halfD * (1 - v);
  const triH = H * (1 - vt);

  const shape = new THREE.Shape();
  shape.moveTo(-zHalf, 0);
  shape.lineTo(zHalf, 0);
  shape.lineTo(0, triH);
  shape.closePath();

  for (const sx of [-1, 1]) {
    const geo = new THREE.ExtrudeGeometry(shape, { depth: 0.12, bevelEnabled: false });
    geo.translate(0, 0, -0.06);

    const mesh = new THREE.Mesh(geo, towerWallMat);
    mesh.rotation.y = sx > 0 ? Math.PI / 2 : -Math.PI / 2;
    mesh.position.set(sx * (x + 0.03), baseY, 0);
    mesh.castShadow = true;

    const edges = new THREE.LineSegments(
      new THREE.EdgesGeometry(geo),
      new THREE.LineBasicMaterial({ color: 0x8f6a22 })
    );
    mesh.add(edges);
    parent.add(mesh);
  }
}

function addRoof(parent, { W, D, H, y, upturn = 1.2, ridges = true, gables = false }) {
  const geo = createRoofGeometry(W, D, H, { upturn });

  const mesh = new THREE.Mesh(geo, roofMat);
  mesh.position.y = y;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);

  const under = new THREE.Mesh(geo, underRoofMat);
  under.position.y = y - 0.32;
  parent.add(under);

  const eaveBeamMat = darkRedMat;
  const beamGeoX = new THREE.BoxGeometry(W + 0.4, 0.42, 0.34);
  const beamGeoZ = new THREE.BoxGeometry(0.34, 0.42, D + 0.4);
  for (const sz of [-1, 1]) {
    const b = new THREE.Mesh(beamGeoX, eaveBeamMat);
    b.position.set(0, y - 0.28, sz * (D / 2 - 0.1));
    b.castShadow = true;
    parent.add(b);
  }
  for (const sx of [-1, 1]) {
    const b = new THREE.Mesh(beamGeoZ, eaveBeamMat);
    b.position.set(sx * (W / 2 - 0.1), y - 0.28, 0);
    b.castShadow = true;
    parent.add(b);
  }

  if (ridges) addRidges(parent, W, D, H, y, upturn);
  addEaveTiles(parent, W, D, y, upturn);
  if (gables) addGable(parent, W, D, H, y);
}

function makeRailing(length, { height = 0.95, gap = 2.2, mat = stonePlainMat } = {}) {
  const geos = [];

  function addBox(w, h, d, x, y, z) {
    const g = new THREE.BoxGeometry(w, h, d);
    g.translate(x, y, z);
    geos.push(g);
  }

  addBox(length, 0.16, 0.34, 0, 0.08, 0);

  const n = Math.max(2, Math.round(length / gap));
  const seg = length / n;

  for (let i = 0; i < n; i++) {
    const x = -length / 2 + (i + 0.5) * seg;
    addBox(seg - 0.36, 0.28, 0.12, x, 0.33, 0);
  }

  for (let i = 0; i <= n; i++) {
    const x = -length / 2 + i * seg;
    addBox(0.24, height, 0.24, x, height / 2, 0);
    addBox(0.3, 0.1, 0.3, x, height + 0.05, 0);
    addBox(0.16, 0.16, 0.16, x, height + 0.18, 0);
  }

  const geo = mergeGeometries(geos, false);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function makeSteps(width, zNear, zFar, topY, count = 5, mat = stoneMat) {
  const g = new THREE.Group();
  const depth = (zNear - zFar) / count;
  for (let i = 0; i < count; i++) {
    const h = topY * (i + 1) / count;
    const step = new THREE.Mesh(new THREE.BoxGeometry(width, h, depth + 0.02), mat);
    step.position.set(0, h / 2, zNear - depth * (i + 0.5));
    step.castShadow = true;
    step.receiveShadow = true;
    g.add(step);
  }
  return g;
}

function makeBridge(width, length, zCenter) {
  const g = new THREE.Group();

  const deck = new THREE.Mesh(new THREE.BoxGeometry(width, 0.75, length), stonePlainMat);
  deck.position.set(0, 0.85, zCenter);
  deck.castShadow = true;
  deck.receiveShadow = true;
  g.add(deck);

  for (const dz of [-length * 0.3, 0, length * 0.3]) {
    const pier = new THREE.Mesh(new THREE.BoxGeometry(width * 0.92, 1.25, 1.7), stonePlainMat);
    pier.position.set(0, 0.38, zCenter + dz);
    pier.castShadow = true;
    pier.receiveShadow = true;
    g.add(pier);
  }

  for (const sx of [-1, 1]) {
    const rail = makeRailing(length, { height: 0.85, gap: 2.8 });
    rail.rotation.y = Math.PI / 2;
    rail.position.set(sx * (width / 2 - 0.15), 1.2, zCenter);
    g.add(rail);
  }
  return g;
}

function makeTree(scale = 1) {
  const g = new THREE.Group();

  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.44, 5.6, 7), trunkMat);
  trunk.position.y = 2.8;
  g.add(trunk);

  const blobs = [
    [0.0, 6.2, 0.0, 2.35],
    [-0.55, 8.3, 0.3, 1.85],
    [0.5, 10.1, -0.25, 1.45],
    [-0.2, 11.6, 0.15, 1.0]
  ];

  for (const [x, y, z, r] of blobs) {
    const geo = new THREE.IcosahedronGeometry(r, 2);
    const pos = geo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const f = 0.86 + Math.random() * 0.24;
      pos.setXYZ(i, pos.getX(i) * f, pos.getY(i) * f * 1.12, pos.getZ(i) * f);
    }
    geo.computeVertexNormals();
    const blob = new THREE.Mesh(geo, treeMat);
    blob.position.set(x, y, z);
    blob.castShadow = true;
    blob.receiveShadow = true;
    g.add(blob);
  }

  g.scale.setScalar(scale);
  return g;
}

  platform.add(rail);
}

/* 台阶、石狮、华表 */
platform.add(makeSteps(14, 20.2, 16.2, 1.24, 5));

for (const sx of [-1, 1]) {
  const lion = makeLion();
  lion.position.set(sx * 16.5, 0, 20.4);
  lion.rotation.y = sx * -0.25;
  lion.scale.setScalar(1.15);
  scene.add(lion);

  const huabiao = makeHuabiao();
  huabiao.position.set(sx * 31, 0, 22.5);
  scene.add(huabiao);
}

/* ============================================================
   8. 金水桥
   ============================================================ */

const bridges = [
  { x: 0, w: 9.0 },
  { x: -11.5, w: 6.4 },
  { x: 11.5, w: 6.4 },
  { x: -22, w: 6.0 },
  { x: 22, w: 6.0 }
];
for (const b of bridges) {
  const bridge = makeBridge(b.w, 24, 32);
  bridge.position.x = b.x;
  scene.add(bridge);
}

/* ============================================================
   9. 城楼
   ============================================================ */

const tower = new THREE.Group();
tower.position.y = 12.64;
scene.add(tower);

const TOWER_W = 52;
const TOWER_H = 11;
const TOWER_D = 16;

const towerBody = new THREE.Mesh(
  new THREE.BoxGeometry(TOWER_W, TOWER_H, TOWER_D),
  towerWallMat
);
towerBody.position.y = TOWER_H / 2;
towerBody.castShadow = true;
towerBody.receiveShadow = true;
tower.add(towerBody);

/* 台明 */
const terrace = new THREE.Mesh(new THREE.BoxGeometry(58, 1.2, 22), stoneMat);
terrace.position.y = -0.6;
terrace.castShadow = true;
terrace.receiveShadow = true;
tower.add(terrace);

const towerRail = makeRailing(58, { height: 1.05, gap: 2.1 });
towerRail.position.set(0, 0.02, 10.9);
tower.add(towerRail);

for (const sx of [-1, 1]) {
  const rail = makeRailing(22, { height: 1.05, gap: 2.1 });
  rail.rotation.y = Math.PI / 2;
  rail.position.set(sx * 28.9, 0.02, 0);
  tower.add(rail);
}

/* 开间：柱、门窗 */
const BAYS = 9;
const bayW = TOWER_W / BAYS;
for (let i = 0; i <= BAYS; i++) {
  const x = -TOWER_W / 2 + i * bayW;
  const col = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.54, TOWER_H, 14), darkRedMat);
  col.position.set(x, TOWER_H / 2, TOWER_D / 2 + 0.35);
  col.castShadow = true;
  tower.add(col);

  const baseStone = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.78, 0.28, 12), stonePlainMat);
  baseStone.position.set(x, 0.16, TOWER_D / 2 + 0.35);
  tower.add(baseStone);
}

for (let i = 0; i < BAYS; i++) {
  const x = -TOWER_W / 2 + (i + 0.5) * bayW;
  const isCenter = i >= 3 && i <= 5;
  const h = isCenter ? 8.4 : 7.4;
  const panel = new THREE.Mesh(new THREE.PlaneGeometry(bayW - 1.25, h), latticeMat);
  panel.position.set(x, isCenter ? h / 2 + 0.32 : h / 2 + 1.2, TOWER_D / 2 + 0.03);
  tower.add(panel);

  if (isCenter) {
    const door = new THREE.Mesh(new THREE.PlaneGeometry(bayW - 1.9, 3.5), doorMat);
    door.position.set(x, 1.78, TOWER_D / 2 + 0.06);
    tower.add(door);
  }
}

/* 额枋与彩画 */
const lintel = new THREE.Mesh(new THREE.BoxGeometry(TOWER_W + 1.4, 1.05, 0.55), caihuaMat);
lintel.position.set(0, TOWER_H - 0.55, TOWER_D / 2 + 0.42);
lintel.castShadow = true;
tower.add(lintel);

const goldLine = new THREE.Mesh(new THREE.BoxGeometry(TOWER_W + 1.6, 0.08, 0.08), goldMat);
goldLine.position.set(0, TOWER_H - 0.02, TOWER_D / 2 + 0.7);
tower.add(goldLine);

/* 檐下斗拱 */
for (let i = 0, x = -TOWER_W / 2 + 1.4; x <= TOWER_W / 2 - 1.4; x += 2.6, i++) {
  const dou = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.62, 0.9), i % 2 ? caihuaMat : goldMat);
  dou.position.set(x, TOWER_H - 0.92, TOWER_D / 2 + 0.55);
  dou.castShadow = true;
  tower.add(dou);
}

/* 下层檐 */
addRoof(tower, { W: 60, D: 24, H: 4.6, y: TOWER_H - 0.1, upturn: 0.9 });

/* 上层主体 */
const upper = new THREE.Group();
upper.position.y = TOWER_H + 0.8;
tower.add(upper);

const upperBody = new THREE.Mesh(new THREE.BoxGeometry(40, 5.0, 11.5), towerWallMat);
upperBody.position.y = 2.5;
upperBody.castShadow = true;
upper.add(upperBody);

for (let i = 0; i < 9; i++) {
  const x = -16 + (i + 0.5) * 4;
  if (Math.abs(x) < 7) continue;
  const panel = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 1.6), latticeMat);
  panel.position.set(x, 3.3, 5.78);
  upper.add(panel);
}

for (let i = 0, x = -19; x <= 19; x += 2.4, i++) {
  const dou = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.46, 0.7), i % 2 ? caihuaMat : goldMat);
  dou.position.set(x, 4.55, 5.95);
  upper.add(dou);
}

const plaque = new THREE.Mesh(
  new THREE.PlaneGeometry(7.8, 2.2),
  new THREE.MeshStandardMaterial({ map: plaqueTex, roughness: 0.6 })
);
plaque.position.set(0, 3.7, 5.82);
upper.add(plaque);

/* 上层檐 */
addRoof(tower, { W: 47, D: 20, H: 7.0, y: TOWER_H + 5.8, upturn: 1.1 });

/* ============================================================
   10. 旗杆与国旗
   ============================================================ */

const flagPole = new THREE.Mesh(
  new THREE.CylinderGeometry(0.22, 0.32, 26, 12),
  new THREE.MeshStandardMaterial({ color: 0xd8d4c8, roughness: 0.4, metalness: 0.5 })
);
flagPole.position.set(-34, 13, 44);
flagPole.castShadow = true;
scene.add(flagPole);

const poleFinial = new THREE.Mesh(new THREE.SphereGeometry(0.36, 14, 10), goldMat);
poleFinial.position.set(-34, 26.25, 44);
poleFinial.castShadow = true;
scene.add(poleFinial);

const flagGeo = new THREE.PlaneGeometry(12, 8, 44, 22);
flagGeo.translate(6, 0, 0);
const flagMat = new THREE.MeshStandardMaterial({
  map: flagTex,
  color: 0xbfaea6,
  side: THREE.DoubleSide,
  roughness: 0.86,
  emissive: 0x220000,
  emissiveIntensity: 0.04
});
const flag = new THREE.Mesh(flagGeo, flagMat);
flag.position.set(-33.8, 21.6, 44);
flag.scale.setScalar(0.92);
flag.castShadow = true;
scene.add(flag);

const flagBasePositions = flagGeo.attributes.position.array.slice();

/* ============================================================
   11. 两侧树木
   ============================================================ */

const treePositions = [
  [-58, -26, 0.95], [-70, 2, 1.05], [-64, 28, 0.9],
  [58, -26, 0.95], [70, 2, 1.05], [64, 28, 0.9]
];
for (const [x, z, s] of treePositions) {
  const t = makeTree(s);
  t.position.set(x, 0, z);
  t.rotation.y = Math.random() * Math.PI * 2;
  scene.add(t);
}

/* 广场华灯 */
for (const [x, z] of [[-44, 58], [44, 58], [-44, 86], [44, 86]]) {
  const lamp = makeLamp();
  lamp.position.set(x, 0, z);
  scene.add(lamp);
}

/* 旗杆基座 */
const flagBase = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.75, 0.55, 16), stoneMat);
flagBase.position.set(-34, 0.27, 44);
flagBase.castShadow = true;
flagBase.receiveShadow = true;
scene.add(flagBase);

/* 广场与桥上的人，提供尺度参照 */
const peopleData = [
  [0, 1.225, 28, 0.2], [1.3, 1.225, 32, 1.4], [-1.5, 1.225, 36, -0.6],
  [11.5, 1.225, 27, 0.8], [10.2, 1.225, 34, 2.1], [-11.5, 1.225, 31, -1.2],
  [22, 1.225, 29, 0.4], [-22, 1.225, 35, 2.6],
  [-32, 0, 58, 0.9], [28, 0, 62, -1.7], [36, 0, 70, 2.2],
  [-18, 0, 72, 0.2], [16, 0, 50, 1.1], [-8, 0, 66, -2.4]
];
const shirtColors = [0x2c3a4a, 0x5a2a26, 0x2a2a2a, 0x4a4a52, 0x6a5a48, 0x3a4a3a];
peopleData.forEach(([x, y, z, ry], i) => {
  const p = makePerson(shirtColors[i % shirtColors.length]);
  p.position.set(x, y, z);
  p.rotation.y = ry;
  p.scale.setScalar(0.92);
  scene.add(p);
});

/* 远处的树带，压住天际线 */
for (let x = -180; x <= 180; x += 40) {
  const t = makeTree(1.2);
  t.position.set(x + (Math.random() - 0.5) * 10, 0, -120 - Math.random() * 20);
  t.rotation.y = Math.random() * Math.PI * 2;
  scene.add(t);
}

/* ============================================================
   12. 动画
   ============================================================ */

const clock = new THREE.Clock();

function animateFlag(t) {
  const pos = flagGeo.attributes.position;
  const arr = pos.array;
  for (let i = 0; i < pos.count; i++) {
    const x = flagBasePositions[i * 3];
    const y = flagBasePositions[i * 3 + 1];
    const k = Math.max(0, x / 12);
    const wave =
      Math.sin(x * 0.58 - t * 3.6) * 1.0 * k +
      Math.sin(y * 0.72 + t * 2.4) * 0.32 * k;
    arr[i * 3 + 2] = wave;
  }
  pos.needsUpdate = true;
  flagGeo.computeVertexNormals();
}

function animate() {
  const t = clock.getElapsedTime();
  animateFlag(t);
  gradePass.uniforms.uTime.value = t;
  controls.update();
  composer.render();
  requestAnimationFrame(animate);
}

/* ============================================================
   13. 窗口与加载
   ============================================================ */

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

animate();

requestAnimationFrame(() => {
  requestAnimationFrame(() => {
    document.getElementById('loader').classList.add('done');
  });
});

window.addEventListener('error', (e) => {
  if (e && e.message) {
    document.getElementById('error').style.display = 'flex';
  }
});

setTimeout(() => {
  if (!renderer.info.render.frame) {
    document.getElementById('error').style.display = 'flex';
  }
}, 12000);
</script>
</body>
</html>
