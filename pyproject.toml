[project]
name = "lc-agent-app"
version = "0.7"
description = "LangChain Agent framework with built-in Web UI"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "langchain>=1.0",
    "langgraph>=0.4",
    "langchain-openai",
    "langchain-deepseek",
    "fastapi>=0.115",
    "uvicorn[standard]",
    "sqlmodel>=0.0.22",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "langgraph-checkpoint-sqlite>=3.0",
    "python-dotenv",
    "commentjson",
    "websockets",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "langchain-agentskills>=0.4",
    "mcp>=1.0",
    "langmem",
    "apscheduler>=3.11,<4",
  
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx",
    "ruff",
]
desktop = [
    "pywebview>=5.0",
]
# Optional: enables database.checkpoint_url with a PostgreSQL URL.
postgres = [
    "langgraph-checkpoint-postgres>=3.0",
    "psycopg[binary,pool]>=3.1",
    "psycopg2>=2.9",
]

[project.scripts]
lc-agent = "lc_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lc_agent"]

[tool.hatch.build.targets.sdist]
include = ["lc_agent/**", "README.md", "pyproject.toml", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# [tool.ruff]
# target-version = "py312"
# line-length = 120


[tool.hatch.build]
packages = ["lc_agent"]
